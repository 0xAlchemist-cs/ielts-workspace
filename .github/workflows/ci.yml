# Full verification gate — the same one developers run locally (verify:all).
# CI starts from a FRESH database: schema push → seed corpus → test-dict
# subset → lint + tsc + every product/security/data suite.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fresh database (schema + seed + banks + CET fixtures + test dict subset)
        run: |
          npm run db:push
          npm run db:seed
          npm run db:questions
          npm run db:cetfixtures
          DICT_CSV=data/test-fixtures/dict/ecdict.csv \
            DICT_LEMMA=data/test-fixtures/dict/lemma.en.txt \
            npm run db:dict

      - name: Full gate (normalize + lint + tsc + all verify suites)
        # same isolation contract as the pre-push hook: the suite runs on an
        # isolated WAL-consistent snapshot with test isolation enforced —
        # never on the default database path
        run: node scripts/with-test-db.mjs npm run verify:all
